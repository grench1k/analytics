<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e17">
<title>Рынки — Market Analytics</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <div class="logo-icon">📈</div>
    <div>Market<span style="color:var(--blue)">Analytics</span></div>
  </a>
  <div class="live-badge">
    <div class="pulse"></div>
    <span id="lastUpdate">--:--</span>
  </div>
</header>

<div class="container">

  <div class="page-header">
    <div class="page-title">📊 Рынки</div>
    <div class="page-subtitle">Все отслеживаемые активы в реальном времени</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="all">🌐 Все</button>
    <button class="tab" data-tab="stocks">📊 Акции</button>
    <button class="tab" data-tab="bonds">🏛️ Облигации</button>
    <button class="tab" data-tab="crypto">₿ Крипто</button>
  </div>

  <div class="table-section">
    <table>
      <thead>
        <tr>
          <th>Актив</th>
          <th>Цена</th>
          <th>24ч</th>
          <th class="hide-xs">RSI</th>
          <th>Прогноз</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:20px;">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item"><span class="nav-item-icon">🏠</span><span>Главная</span></a>
  <a href="markets.html" class="nav-item"><span class="nav-item-icon">📊</span><span>Рынки</span></a>
  <a href="analysis.html" class="nav-item"><span class="nav-item-icon">🎯</span><span>Аналитика</span></a>
  <a href="portfolio.html" class="nav-item"><span class="nav-item-icon">💼</span><span>Портфель</span></a>
  <a href="about.html" class="nav-item"><span class="nav-item-icon">ℹ️</span><span>О проекте</span></a>
</nav>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
