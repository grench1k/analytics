<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market">
<meta name="theme-color" content="#0a0e17">
<title>Market Analytics — Дашборд</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <div class="logo-icon">📈</div>
    <div>Market<span style="color:var(--blue)">Analytics</span></div>
  </a>
  <div class="live-badge">
    <div class="pulse"></div>
    <span id="lastUpdate">--:--</span>
  </div>
</header>

<div class="container">

  <!-- RECOMMENDATIONS -->
  <div class="rec-block">
    <div class="rec-header">
      <div>
        <div class="rec-title">🎯 Что выгоднее купить</div>
        <div class="rec-subtitle">Прогнозы аналитиков · <span id="recUpdate">—</span></div>
      </div>
      <button class="btn" id="refreshBtn">🔄 Обновить</button>
    </div>
    <div class="rec-grid" id="recGrid">
      <div style="color:var(--text-dim);padding:20px;text-align:center;font-size:13px;">Загрузка...</div>
    </div>
    <div class="alloc-grid" id="allocGrid"></div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-label">IMOEX</div>
      <div class="stat-value" id="imoex">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">BTC / USD</div>
      <div class="stat-value" id="btcPrice">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Ставка ЦБ</div>
      <div class="stat-value" id="keyRate">14,5%</div>
    </div>
    <div class="stat">
      <div class="stat-label">Индекс страха</div>
      <div class="stat-value" style="color:var(--yellow)" id="fearIndex">64</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="all">🌐 Все</button>
    <button class="tab" data-tab="stocks">📊 Акции</button>
    <button class="tab" data-tab="bonds">🏛️ Облигации</button>
    <button class="tab" data-tab="crypto">₿ Крипто</button>
  </div>

  <!-- CARDS -->
  <div class="grid" id="cardsGrid"></div>

  <!-- MAIN CHART -->
  <div class="chart-section">
    <div class="section-title">
      <span>📉 Динамика</span>
      <div class="period-btns">
        <button class="period-btn" data-period="1">1Д</button>
        <button class="period-btn" data-period="7">7Д</button>
        <button class="period-btn active" data-period="30">30Д</button>
        <button class="period-btn" data-period="365">1Г</button>
      </div>
    </div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
  </div>

  <!-- INDICATORS -->
  <div class="indicators-grid">
    <div class="chart-section">
      <div class="section-title">
        <span>📊 RSI (14)</span>
        <span id="rsiSignal" class="signal-badge signal-neutral">—</span>
      </div>
      <div class="chart-wrap-sm"><canvas id="rsiChart"></canvas></div>
    </div>

    <div class="chart-section">
      <div class="section-title">
        <span>📈 MACD</span>
        <span id="macdSignal" class="signal-badge signal-neutral">—</span>
      </div>
      <div class="chart-wrap-sm"><canvas id="macdChart"></canvas></div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="index.html" class="nav-item">
    <span class="nav-item-icon">🏠</span>
    <span>Главная</span>
  </a>
  <a href="markets.html" class="nav-item">
    <span class="nav-item-icon">📊</span>
    <span>Рынки</span>
  </a>
  <a href="analysis.html" class="nav-item">
    <span class="nav-item-icon">🎯</span>
    <span>Аналитика</span>
  </a>
  <a href="portfolio.html" class="nav-item">
    <span class="nav-item-icon">💼</span>
    <span>Портфель</span>
  </a>
  <a href="about.html" class="nav-item">
    <span class="nav-item-icon">ℹ️</span>
    <span>О проекте</span>
  </a>
</nav>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
